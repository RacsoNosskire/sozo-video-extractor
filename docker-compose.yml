services:
  sozo-extractor:
    build: .
    restart: unless-stopped
    ports:
      - "3232:3232"
    environment:
      - PORT=3232
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          # Chromium is memory-hungry; AnimePahe + Miruro can run tabs at once.
          memory: 2G
        reservations:
          memory: 512M
    # Larger /dev/shm keeps Chromium stable with multiple tabs.
    shm_size: '512m'
